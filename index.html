<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空杀 玩法胜率数据看板</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;margin:0;background:#0f1420;color:#e8ecf4;}
header{background:linear-gradient(135deg,#1a2332,#2c3e50);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:2px solid #3498db;}
header h1{margin:0;font-size:22px;color:#fff;}
header .meta{font-size:13px;color:#aab4c4;}
#controls{background:#1a2332;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #2c3e50;position:sticky;top:0;z-index:10;}
#controls label{font-size:13px;color:#aab4c4;}
select,button{background:#2c3e50;color:#e8ecf4;border:1px solid #3d5167;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer;}
select:focus,button:focus{outline:2px solid #3498db;}
#mode-select{margin-right:4px;}
main{max-width:1200px;margin:20px auto;padding:0 16px;}
#summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
.sum-card{background:#1a2332;border:1px solid #2c3e50;border-radius:10px;padding:12px 18px;flex:1;min-width:150px;text-align:center;}
.sum-card .num{font-size:26px;font-weight:bold;color:#3498db;}
.sum-card .lbl{font-size:12px;color:#aab4c4;margin-top:4px;}
#chart{background:#1a2332;border:1px solid #2c3e50;border-radius:10px;padding:12px;margin-bottom:16px;}
#chart-title{font-size:14px;color:#aab4c4;margin:4px 8px 8px;}
#table-wrap{overflow-x:auto;background:#1a2332;border:1px solid #2c3e50;border-radius:10px;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #24303f;white-space:nowrap;}
th{background:#24303f;color:#aab4c4;position:sticky;top:110px;z-index:5;}
tr:hover{background:#223047;}
.pos{color:#2ecc71;}
.neg{color:#e74c3c;}
.up{color:#2ecc71;}
.down{color:#e74c3c;}
.warn{background:rgba(231,76,60,.18);}
#footer{text-align:center;color:#5b6b80;font-size:12px;padding:20px 0 30px;}
#legend{display:flex;gap:14px;margin:0 8px 6px;font-size:12px;color:#aab4c4;}
#legend span{display:inline-flex;align-items:center;gap:4px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
.tooltip{position:fixed;background:rgba(20,28,40,.95);border:1px solid #3498db;border-radius:8px;padding:10px 14px;font-size:12px;pointer-events:none;z-index:100;max-width:320px;display:none;line-height:1.6;}
@media(max-width:640px){header h1{font-size:18px;}th,td{padding:6px 8px;}main{padding:0 8px;}}
</style>
</head>
<body>
<header>
<h1>太空杀 玩法胜率数据看板</h1>
<div class="meta" id="generated">数据更新至 2026-10-25</div>
</header>
<div id="controls">
<label for="mode-select">玩法模式</label>
<select id="mode-select"><option value="1">诸神排位</option><option value="2">特别行动单人排位</option><option value="0">巅峰赛</option></select>
<label for="date-select">数据日期</label>
<select id="date-select"></select>
<label for="camp-select">阵营</label>
<select id="camp-select"><option value="">全部</option><option value="船员阵营">船员阵营</option><option value="入侵者阵营">入侵者阵营</option><option value="中立阵营">中立阵营</option></select>
<button id="btn-last7">近7天</button>
<button id="btn-last30">近30天</button>
<button id="btn-all">全部</button>
<button id="btn-reset">重置</button>
<span id="rows-count" style="margin-left:auto;font-size:12px;color:#aab4c4;"></span>
</div>
<main>
<div id="summary"></div>
<div id="chart">
<div id="chart-title">各身份胜率与选取率趋势</div>
<div id="legend"><span><i class="dot" style="background:#3498db;"></i>胜率</span><span><i class="dot" style="background:#e67e22;"></i>选取率</span></div>
<div id="chart-canvas" style="height:360px;"></div>
</div>
<div id="table-wrap">
<table id="data-table">
<thead><tr><th>身份</th><th>阵营</th><th>胜率</th><th>选取率</th><th>胜率同比</th><th>选取率同比</th><th>趋势</th></tr></thead>
<tbody></tbody>
</table>
</div>
</main>
<div class="tooltip" id="tooltip"></div>
<footer id="footer">数据来源：闭门造车玩法小组 · 职业胜率机器人每日发布 · 自动采集更新</footer>
